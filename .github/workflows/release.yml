name: Release

# Every push to main updates a "release PR" (version bump + changelog) from the
# feat:/fix: commits. Merging that PR creates the tag and GitHub Release, and the
# second job builds the signed APK and AAB and attaches them to it.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > inkwell-upload.jks
            {
              echo "storeFile=inkwell-upload.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 is not set. The release files will be unsigned and cannot be installed."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the APK and AAB
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Name the files and attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          suffix=""
          [ "$SIGNED" = "true" ] || suffix="-unsigned"
          mkdir dist
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$apk" "dist/Inkwell-${VERSION}${suffix}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/Inkwell-${VERSION}${suffix}.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release upload "$TAG" dist/* --clobber
